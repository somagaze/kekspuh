[project]
name = "kekspuh"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "pyrefly>=0.60.0",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "ruff>=0.17.3",
]

[project.scripts]
kekspuh = "kekspuh:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.ruff.lint]
extend-select = [
    "A" #
]
